<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} - {{ site.title }}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #333;
      background: #fff;
      line-height: 1.9;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    .topbar {
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .topbar .container {
      display: flex;
      gap: 30px;
      padding: 12px 0;
    }

    .topbar a:hover,
    .main-nav a:hover {
      color: #146bb7;
    }

    header {
      padding: 48px 0 32px;
    }

    .site-title {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
    }

    .site-title a {
      color: #333;
    }

    .site-description {
      margin-top: 5px;
      color: #777;
    }

    .main-nav {
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .main-nav .container {
      display: flex;
      gap: 32px;
      padding: 15px 0;
    }

    main {
      width: min(760px, 90%);
      margin: 0 auto;
      padding: 60px 0;
    }

    .meta {
      color: #146bb7;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .post-title {
      margin: 0 0 35px;
      font-size: 34px;
      line-height: 1.4;
    }

    .post-content {
      font-size: 17px;
      color: #444;
    }

    .post-content p {
      margin: 0 0 24px;
    }

    .post-content h2 {
      margin-top: 45px;
      font-size: 25px;
    }

    .post-content h3 {
      margin-top: 35px;
      font-size: 21px;
    }

    .post-content img {
      max-width: 100%;
      height: auto;
    }

    .post-content blockquote {
      margin: 30px 0;
      padding-left: 20px;
      border-left: 4px solid #ddd;
      color: #666;
    }

    .post-content a {
      color: #146bb7;
    }

    .back {
      display: inline-block;
      margin-top: 45px;
      color: #146bb7;
    }

    footer {
      margin-top: 40px;
      border-top: 1px solid #eee;
      padding: 30px 0;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .site-title {
        font-size: 30px;
      }

      .post-title {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="container">
      <a href="/">首页</a>
      <a href="/articles.html">文章列表</a>
      <a href="/about.html">关于</a>
    </div>
  </div>

  <header>
    <div class="container">
      <h1 class="site-title">
        <a href="/">{{ site.title }}</a>
      </h1>

      <div class="site-description">
        {{ site.description }}
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <div class="container">
      <a href="/">首页</a>
      <a href="/articles.html">文章列表</a>
      <a href="/about.html">关于</a>
    </div>
  </nav>

  <main>

    <div class="meta">
      {% if page.category %}
        {{ page.category }} ·
      {% endif %}

      {{ page.date | date: "%Y年%m月%d日" }}
    </div>

    <h1 class="post-title">
      {{ page.title }}
    </h1>

    <div class="post-content">
      {{ content }}
    </div>

    <a class="back" href="/articles.html">
      ← 返回文章列表
    </a>

  </main>

  <footer>
    <div class="container">
      Copyright © 2026 {{ site.title }}
    </div>
  </footer>

</body>
</html>
