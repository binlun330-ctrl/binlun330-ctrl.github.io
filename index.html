<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邦邦的乔布勒斯日记</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #333;
      background: #fff;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    .topbar {
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .topbar .container {
      display: flex;
      gap: 30px;
      padding: 12px 0;
    }

    .topbar a:hover {
      color: #146bb7;
    }

    header {
      padding: 48px 0 32px;
    }

    .site-title {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
    }

    .site-description {
      margin-top: 5px;
      color: #777;
    }

    nav.main-nav {
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    nav.main-nav .container {
      display: flex;
      gap: 32px;
      padding: 15px 0;
    }

    nav.main-nav a:hover {
      color: #146bb7;
    }

    main {
      padding: 55px 0;
    }

    .posts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 45px 35px;
    }

    article {
      min-width: 0;
    }

    .meta {
      font-size: 13px;
      color: #146bb7;
      margin-bottom: 10px;
    }

    article h2 {
      margin: 0 0 15px;
      font-size: 23px;
      line-height: 1.45;
    }

    article p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }

    .read-more {
      display: inline-block;
      margin-top: 18px;
      color: #146bb7;
      font-size: 14px;
    }

    footer {
      margin-top: 50px;
      border-top: 1px solid #eee;
      padding: 30px 0;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .posts {
        grid-template-columns: 1fr;
      }

      .site-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="container">
      <a href="index.html">首页</a>
      <a href="articles.html">文章列表</a>
      <a href="about.html">关于</a>
    </div>
  </div>

  <header>
    <div class="container">
      <h1 class="site-title">邦邦的乔布勒斯日记</h1>
      <div class="site-description">拿出真本事</div>
    </div>
  </header>

  <nav class="main-nav">
    <div class="container">
      <a href="index.html">首页</a>
      <a href="articles.html">文章列表</a>
      <a href="about.html">关于</a>
    </div>
  </nav>

  <main class="container">

    <div class="posts">

      <article>
        <div class="meta">随笔 · 2026年8月14日</div>
        <h2>第一篇文章</h2>
        <p>
          这是我的个人博客。从这里开始，我会把值得长期保存的文字放在这里。
        </p>
        <a class="read-more" href="#">阅读更多 →</a>
      </article>

      <article>
        <div class="meta">生活 · 2026年8月14日</div>
        <h2>关于这个网站</h2>
        <p>
          不依赖社交平台，不追求流量，只保存自己真正想留下来的内容。
        </p>
        <a class="read-more" href="#">阅读更多 →</a>
      </article>

      <article>
        <div class="meta">杂谈 · 2026年8月14日</div>
        <h2>一片属于自己的地方</h2>
        <p>
          一个简单、安静、可以持续很多年的个人网站。
        </p>
        <a class="read-more" href="#">阅读更多 →</a>
      </article>

    </div>

  </main>

  <footer>
    <div class="container">
      Copyright © 2026 binlun330-ctrl
    </div>
  </footer>

</body>
</html>
